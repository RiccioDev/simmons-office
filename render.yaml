databases:
  - name: simmons-office-db
    plan: free
    databaseName: simmonsoffice
    user: simmons

services:
  - type: web
    name: simmons-office
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: simmons-office-db
          property: connectionString
